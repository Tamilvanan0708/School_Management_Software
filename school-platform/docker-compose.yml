services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_secret
      POSTGRES_DB: school_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://school:school_secret@db:5432/school_platform
      JWT_SECRET: change-me-in-production
      JWT_EXPIRATION: 7d
      PORT: "4000"
      ALLOWED_ORIGINS: http://localhost:3000
      # RAZORPAY_KEY_ID: ""
      # RAZORPAY_KEY_SECRET: ""
      # RAZORPAY_WEBHOOK_SECRET: ""
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node backend/dist/main.js"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: